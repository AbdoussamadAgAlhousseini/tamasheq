[project]
name = "tamasheq-api"
version = "0.1.0"
description = "API du projet TAMASHEQ"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.2.0",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "sacrebleu>=2.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # FastAPI recommande httpx2 pour TestClient ; migration à faire quand FastAPI la documente.
    "ignore:Using `httpx` with `starlette.testclient`",
]
