# Base de données locale de développement. Identifiants factices, à ne pas réutiliser ailleurs.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tamasheq
      POSTGRES_PASSWORD: tamasheq
      POSTGRES_DB: tamasheq
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tamasheq"]
      interval: 5s
      retries: 10

volumes:
  postgres-data:
